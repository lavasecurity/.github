name: Code Review

# lavasecurity/.github reviews its own pull requests with the reusable AI code-review
# workflow it hosts. Named self-review.yml because code-review.yml is the reusable
# workflow itself. Keep the secret-bearing implementation on trusted main; PR changes
# are exercised by local fixture tests. The reusable only triggers on workflow_call,
# so there is no recursion. Requires the repo secret
# OCR_LLM_AUTH_TOKEN (the OpenCode Go API key).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  code-review:
    permissions:
      contents: read
      pull-requests: write
    uses: lavasecurity/.github/.github/workflows/code-review.yml@main
    with:
      # This public repository can use Go's free model while paid requests time out.
      # The credential destination remains defined by the trusted reusable workflow.
      llm_model: longcat-2.5-preview-free
      use_anthropic: false
    secrets:
      llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
